<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NBA Clutch Agent</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 16px; line-height: 1.5; }
  #log { white-space: pre-wrap; border: 1px solid #ccc; border-radius: 8px; padding: 12px; min-height: 160px; margin: 1rem 0; }
  form { display: flex; gap: 8px; } input { flex: 1; padding: 8px; } button { padding: 8px 16px; }
</style>
</head>
<body>
<h1>NBA Clutch Agent</h1>
<p>Ask about crunch time in NBA play-by-play data (2015-16 to 2022-23). Placeholder page; full interface coming.</p>
<div id="log"></div>
<form id="f"><input id="q" placeholder="Who shoots best in clutch time?" autocomplete="off"><button>Ask</button></form>
<script>
  let sid = null;
  const log = document.getElementById("log");
  document.getElementById("f").onsubmit = async (e) => {
    e.preventDefault();
    const q = document.getElementById("q"); const message = q.value.trim(); if (!message) return;
    log.textContent += "\nYou: " + message + "\n(thinking...)\n"; q.value = "";
    try {
      const r = await fetch("/chat", { method: "POST", headers: { "Content-Type": "application/json" },
                                       body: JSON.stringify({ message, session_id: sid }) });
      const d = await r.json(); sid = d.session_id;
      log.textContent = log.textContent.replace("(thinking...)\n", "Agent: " + d.response + "\n[" + d.tool_calls.length + " tool calls]\n");
    } catch (err) { log.textContent += "Error: " + err + "\n"; }
  };
</script>
</body>
</html>
